# kleerer. — tracked product sources (seed list).
# Every URL here was verified live during the July 2026 research pass.
# The pipeline fetches these politely and snapshots price + label each run.
# Format is intentionally plain so non-developers can add a line by hand.
#
# id:          stable slug for this tracked source
# product_id:  the scored product id in data.js (links the snapshot to its label_hash)
# brand / name / category: for the report and cross-check
# url:         canonical product page (prefer the official brand site)
# ean:         barcode if known — enables OpenFoodFacts enrichment (no scraping)
# render:      "static" (HTML has the data) or "js" (needs headless, Phase 1)

meta:
  user_agent: "kleerer-bot/0.1 (+https://kleerer.com/bot; supplement price & label transparency; contact: hello@kleerer.com)"
  min_delay_seconds_per_domain: 8       # be gentle
  respect_robots: true
  timeout_seconds: 20


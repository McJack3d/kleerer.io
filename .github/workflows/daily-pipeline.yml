name: daily data pipeline

# The moat, automated. Every morning: politely refresh tracked products, snapshot
# price + label, diff against yesterday, rebuild scores, and commit the new
# snapshots/reports/data.js. The git history becomes the versioned archive.

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily (offset to avoid the top-of-hour rush)
  workflow_dispatch:           # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the daily snapshot

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline (fetch → snapshot → diff)
        working-directory: compare/pipeline
        run: |
          python3 run.py
          echo "----- today's change report -----"
          cat reports/$(date -u +%F).md || true

      - name: Rebuild Health & Compo Scores
        working-directory: compare
        run: python3 scripts/build_scores.py

      - name: Run pipeline tests (offline)
        working-directory: compare/pipeline
        run: python3 tests/test_pipeline.py

      - name: Commit the day's archive
        run: |
          git config user.name  "kleerer-bot"
          git config user.email "bot@kleerer.com"
          git add compare/pipeline/snapshots compare/pipeline/reports compare/data.js
          if git diff --cached --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "data: daily snapshot $(date -u +%F) [skip ci]"
            git push
          fi

name: daily data pipeline

# The moat, automated — PRIVATE-ARCHIVE EDITION.
# Every morning: politely refresh the ~110 tracked products, snapshot price +
# label, diff against yesterday… and commit the archive to the PRIVATE
# kleerer-data repository. The public repo receives no historical data.
#
# Required one-time setup (see compare/pipeline/README.md → "Archive privacy"):
#   1. create the private repo  github.com/kleerer/kleerer-data
#   2. create a fine-grained PAT restricted to that repo (Contents: read/write)
#   3. add it here as the Actions secret  DATA_REPO_TOKEN

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily
  workflow_dispatch:           # manual runs from the Actions tab

permissions:
  contents: read               # public repo is read-only for this job

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private archive (kleerer-data)
        uses: actions/checkout@v4
        with:
          repository: kleerer/kleerer-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-archive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless renderer (Playwright Chromium)
        working-directory: compare/pipeline
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run pipeline (fetch/render → snapshot → diff)
        working-directory: compare/pipeline
        timeout-minutes: 90
        env:
          KLEERER_SNAPSHOT_DIR: ${{ github.workspace }}/data-archive/snapshots
          KLEERER_REPORTS_DIR:  ${{ github.workspace }}/data-archive/reports
        run: |
          python3 run.py --no-cache
          echo "----- today's change report -----"
          cat "$KLEERER_REPORTS_DIR/$(date -u +%F).md" || true

      - name: Run pipeline tests (offline)
        working-directory: compare/pipeline
        run: python3 tests/test_pipeline.py

      - name: Commit the day's archive to the PRIVATE repo
        working-directory: data-archive
        run: |
          git config user.name  "kleerer-bot"
          git config user.email "bot@kleerer.com"
          git add snapshots reports
          if git diff --cached --quiet; then
            echo "No changes to commit today."
          else
            git commit -m "data: daily snapshot $(date -u +%F)"
            git push
          fi
